<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="ECHO"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="application-name" content="ECHO"/>
  <link rel="apple-touch-icon" href="static/icon-180.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="static/icon-180.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="static/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="static/icon-512.png"/>
  <link rel="manifest" href="manifest.json"/>
  <title>ECHO</title>
  <link rel="stylesheet" href="static/style.css"/>
</head>
<body>
  <div id="app">
    <nav id="crumbs" class="crumbs hidden"></nav>
    <div id="stage"></div>
  </div>
  <script src="static/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('[ECHO] SW registered', reg.scope))
          .catch((err) => console.warn('[ECHO] SW failed', err));
      });
    }
  </script>
</body>
</html>
